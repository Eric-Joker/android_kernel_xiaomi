name: 内核构建 - manet

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      use_kpm:
        description: '是否开启KPM功能?'
        required: true
        type: boolean
        default: false
  workflow_call:
    inputs:
      use_kpm:
        required: true
        type: boolean

jobs:
  build-kernels-manet:
    name: "manet"
    strategy:
      fail-fast: false
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      target: "manet"
      use_kpm: ${{ inputs.use_kpm }}
